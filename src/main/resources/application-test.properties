# =====================
# TEST PROFILE SETTINGS
# =====================
# Use isolated H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:vlibrarytest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Enable Swagger UI for manual API testing (optional)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Default admin password for tests
ADMIN_DEFAULT_PASSWORD=test123

# Logging level for debugging tests
logging.level.org.springframework.security=TRACE
